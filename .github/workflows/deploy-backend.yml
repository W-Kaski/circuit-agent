name: Deploy Backend

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          APP_DIR=/www/wwwroot/EricWang/apps/circuit-agent
          APP_PORT=8124
          JAVA_BIN=/www/server/java/jdk-21.0.2/bin/java
          JAR_FILE=$(find backend/target -maxdepth 1 -name "*.jar" ! -name "*original*" ! -name "*sources*" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No deployable jar found in backend/target"
            exit 1
          fi

          echo "Found JAR file: $JAR_FILE"

          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.SERVER_IP }} "mkdir -p ${APP_DIR}"
          scp -i ~/.ssh/id_ed25519 "$JAR_FILE" root@${{ secrets.SERVER_IP }}:${APP_DIR}/app.jar

          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.SERVER_IP }} "
            set -e
            cd ${APP_DIR}

            pkill -f '${APP_DIR}/app.jar' || true
            nohup ${JAVA_BIN} -jar -Xmx512M -Xms256M app.jar > app.log 2>&1 &

            for attempt in \$(seq 1 20); do
              if curl --silent --fail http://127.0.0.1:${APP_PORT}/api/doc.html >/dev/null; then
                echo 'Deployment successful! Backend restarted and passed health check.'
                exit 0
              fi
              sleep 3
            done

            echo 'Health check failed. Recent application log:'
            tail -n 50 app.log || true
            exit 1
          "
