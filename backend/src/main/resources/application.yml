spring:
  application:
    name: circuit-agent
  profiles:
    active: local
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.dashscope.DashScopeAutoConfiguration
      - org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration
  main:
    allow-bean-definition-overriding: true
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY}
      embedding:
        enabled: false
      chat:
        options:
          model: qwen-plus
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:4b-instruct}
          temperature: 0.7
      embedding:
        enabled: false
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}
#    mcp:
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json




server:
  port: 8124
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: com.eric.circuitagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.ai: DEBUG


search-api:
  api-key: ${SEARCH_API_KEY}
